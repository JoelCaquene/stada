{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'pt' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STADA | {% trans "Login" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #05070d;
            --surface-card: rgba(12, 17, 29, 0.86);
            --surface-input: rgba(17, 24, 39, 0.82);
            --border-subtle: rgba(148, 163, 184, 0.18);
            --border-focus: #22d3ee;
            --accent-cyan: #22d3ee;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        /* Fundo persistente estilo plataforma americana */
        .persistent-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 14%, rgba(34, 211, 238, 0.14), transparent 42%),
                radial-gradient(circle at 82% 24%, rgba(99, 102, 241, 0.12), transparent 45%),
                radial-gradient(circle at 18% 82%, rgba(56, 189, 248, 0.1), transparent 45%),
                linear-gradient(180deg, #05070d 0%, #070b14 55%, #04060b 100%);
        }

        .persistent-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(ellipse at center, black 35%, transparent 82%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 82%);
        }

        .page-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 36px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Barra superior: apenas o botão circular com ícone de idioma ao lado direito */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
        }

        .lang-trigger-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: rgba(15, 23, 42, 0.85);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }

        .lang-trigger-btn:hover,
        .lang-trigger-btn[aria-expanded="true"] {
            border-color: var(--border-focus);
            color: var(--accent-cyan);
            transform: translateY(-1px);
        }

        .lang-popover {
            position: absolute;
            top: 48px;
            right: 0;
            min-width: 175px;
            background: #0b1120;
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.72);
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 50;
        }

        .lang-popover.open {
            display: flex;
        }

        .lang-option-btn {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 9px 12px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .lang-option-btn:hover {
            background: rgba(34, 211, 238, 0.12);
            color: #ffffff;
        }

        .lang-option-btn.active {
            background: rgba(34, 211, 238, 0.16);
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Marca e Logotipo Profissional STADA */
        .logo-area {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo-mark-box {
            width: 74px;
            height: 74px;
            margin: 0 auto 12px;
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(34, 211, 238, 0.14), rgba(99, 102, 241, 0.14));
            border: 1px solid rgba(34, 211, 238, 0.32);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .logo-area p {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Card de Login */
        .login-card {
            width: 100%;
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 22px;
            padding: 24px 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 7px;
        }

        /* Campo combinado: apenas indicador numérico (+244, +351...) + número */
        .phone-combined-box {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: 13px;
            padding: 0 14px;
            min-height: 50px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .phone-combined-box:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14);
        }

        .dial-pill-trigger {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding-right: 11px;
            margin-right: 11px;
            border-right: 1px solid rgba(148, 163, 184, 0.22);
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .dial-code-text {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 0.2px;
            font-variant-numeric: tabular-nums;
        }

        .dial-chevron {
            font-size: 11px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .dial-pill-trigger[aria-expanded="true"] .dial-chevron {
            transform: rotate(180deg);
            color: var(--accent-cyan);
        }

        /* Menu suspenso exibindo exclusivamente os indicadores numéricos */
        .dial-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 112px;
            max-height: 230px;
            overflow-y: auto;
            background: #0b1120;
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.78);
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 60;
        }

        .dial-dropdown-menu.open {
            display: flex;
        }

        .dial-item-btn {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 9px;
            padding: 8px 10px;
            color: #f1f5f9;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .dial-item-btn:hover {
            background: rgba(34, 211, 238, 0.12);
            color: #ffffff;
        }

        .dial-item-btn.selected {
            background: rgba(34, 211, 238, 0.18);
            color: var(--accent-cyan);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: 13px;
            padding: 0 14px;
            min-height: 50px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14);
        }

        /* Suporte para inputs gerados dinamicamente pelo Django */
        .input-wrapper input {
            width: 100%;
            padding: 13px 0;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #64748b;
        }

        .input-wrapper i.input-icon {
            color: #64748b;
            margin-right: 11px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .toggle-password {
            cursor: pointer;
            color: #64748b;
            margin-left: 10px;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--accent-cyan);
        }

        .options-row {
            display: flex;
            align-items: center;
            margin: 12px 0 18px 2px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .options-row input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--accent-cyan);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .options-row label {
            cursor: pointer;
            user-select: none;
        }

        .btn-login {
            width: 100%;
            padding: 15px 18px;
            margin-top: 4px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #22d3ee 0%, #38bdf8 55%, #6366f1 100%);
            color: #041019;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(34, 211, 238, 0.26);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 14px 34px rgba(56, 189, 248, 0.36);
            filter: brightness(1.04);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .register-footer a {
            color: var(--accent-cyan);
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        /* Tela de Loading Profissional (1% a 100%) antes de acessar o menu */
        .stada-loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(4, 6, 11, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .stada-loader-overlay.active {
            display: flex;
        }

        .stada-loader-card {
            width: 100%;
            max-width: 350px;
            text-align: center;
            background: rgba(11, 17, 32, 0.9);
            border: 1px solid rgba(34, 211, 238, 0.28);
            border-radius: 22px;
            padding: 28px 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
        }

        .loader-ring {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 3px solid rgba(148, 163, 184, 0.16);
            border-top-color: var(--accent-cyan);
            border-right-color: var(--accent-indigo);
            animation: spinRing 0.85s linear infinite;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .loader-brand {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .loader-percent {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .loader-status {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .progress-track {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            overflow: hidden;
        }

        .progress-fill {
            width: 1%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #22d3ee 0%, #6366f1 100%);
            transition: width 0.04s linear;
        }
    </style>
</head>
<body>
    <!-- Fundo persistente -->
    <div class="persistent-backdrop"></div>
    <div class="persistent-grid"></div>

    <!-- Overlay de carregamento de 1% a 100% antes de avançar para o menu -->
    <div class="stada-loader-overlay" id="stadaLoader" aria-live="polite">
        <div class="stada-loader-card">
            <div class="loader-ring"></div>
            <div class="loader-brand">STADA</div>
            <div class="loader-percent" id="loaderPercent">1%</div>
            <div class="loader-status" data-i18n="loadingText">{% trans "Preparando o acesso ao menu..." %}</div>
            <div class="progress-track">
                <div class="progress-fill" id="loaderProgressBar"></div>
            </div>
        </div>
    </div>

    <div class="page-container">
        <div class="main-wrapper">
            <!-- Botão de idioma: exibe apenas o ícone até ser clicado -->
            <div class="top-bar">
                <button type="button" class="lang-trigger-btn" id="langTriggerBtn" aria-expanded="false" aria-label="Language">
                    <i class="fa-solid fa-globe"></i>
                </button>

                <div class="lang-popover" id="langPopover" role="menu">
                    <button type="button" class="lang-option-btn active" data-lang="pt">
                        <span>Português</span>
                        <span style="opacity:0.65;font-size:11px;">PT</span>
                    </button>
                    <button type="button" class="lang-option-btn" data-lang="en">
                        <span>English</span>
                        <span style="opacity:0.65;font-size:11px;">EN</span>
                    </button>
                    <button type="button" class="lang-option-btn" data-lang="ar">
                        <span>العربية</span>
                        <span style="opacity:0.65;font-size:11px;">AR</span>
                    </button>
                    <button type="button" class="lang-option-btn" data-lang="hi">
                        <span>हिन्दी</span>
                        <span style="opacity:0.65;font-size:11px;">HI</span>
                    </button>
                    <button type="button" class="lang-option-btn" data-lang="es">
                        <span>Español</span>
                        <span style="opacity:0.65;font-size:11px;">ES</span>
                    </button>
                </div>
            </div>

            <!-- Logotipo Profissional STADA -->
            <div class="logo-area">
                <div class="logo-mark-box">
                    <svg width="42" height="42" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <defs>
                            <linearGradient id="stadaLogoGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#22d3ee"/>
                                <stop offset="100%" stop-color="#818cf8"/>
                            </linearGradient>
                        </defs>
                        <rect x="5" y="5" width="38" height="38" rx="11" stroke="url(#stadaLogoGrad)" stroke-width="2.4"/>
                        <path d="M15 30L21.5 22.5L26.5 26.8L33.5 17.5" stroke="url(#stadaLogoGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="33.5" cy="17.5" r="2.8" fill="#22d3ee"/>
                    </svg>
                </div>
                <h1>STADA</h1>
                <p data-i18n="subtitle">{% trans "AAA-202" %}</p>
            </div>

            <div class="login-card">
                <form method="post" class="auth-form" id="loginForm">
                    {% csrf_token %}

                    <!-- Campo 1: Apenas indicador numérico (+244, +351, +55, +1, +20, +91, +234, +258, +34) + número -->
                    <div class="form-group">
                        <label data-i18n="labelPhone">{% trans "Número de Telefone" %}</label>
                        <div class="phone-combined-box">
                            <button type="button" class="dial-pill-trigger" id="dialTriggerBtn" aria-expanded="false" aria-label="Dial code">
                                <span class="dial-code-text" id="dialCodeDisplay">+244</span>
                                <i class="fa-solid fa-chevron-down dial-chevron"></i>
                            </button>

                            <div class="dial-dropdown-menu" id="dialDropdown" role="listbox">
                                <button type="button" class="dial-item-btn selected" data-country="AO" data-dial="+244" data-lang="pt">+244</button>
                                <button type="button" class="dial-item-btn" data-country="PT" data-dial="+351" data-lang="pt">+351</button>
                                <button type="button" class="dial-item-btn" data-country="BR" data-dial="+55" data-lang="pt">+55</button>
                                <button type="button" class="dial-item-btn" data-country="CA" data-dial="+1" data-lang="en">+1</button>
                                <button type="button" class="dial-item-btn" data-country="EG" data-dial="+20" data-lang="ar">+20</button>
                                <button type="button" class="dial-item-btn" data-country="IN" data-dial="+91" data-lang="hi">+91</button>
                                <button type="button" class="dial-item-btn" data-country="NG" data-dial="+234" data-lang="en">+234</button>
                                <button type="button" class="dial-item-btn" data-country="MZ" data-dial="+258" data-lang="pt">+258</button>
                                <button type="button" class="dial-item-btn" data-country="ES" data-dial="+34" data-lang="es">+34</button>
                            </div>

                            {{ form.username }}
                        </div>
                    </div>

                    <!-- Campo 2: Senha -->
                    <div class="form-group">
                        <label data-i18n="labelPass">{% trans "Sua Senha" %}</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            {{ form.password }}
                            <i class="fa-solid fa-eye-slash toggle-password" id="togglePass"></i>
                        </div>
                    </div>

                    <div class="options-row">
                        <input type="checkbox" id="remember" checked>
                        <label for="remember" data-i18n="rememberText">{% trans "Lembrar meus dados" %}</label>
                    </div>

                    <button type="submit" class="btn-login" id="submitLoginBtn" data-i18n="btnLogin">
                        {% trans "Entrar" %}
                    </button>
                </form>
            </div>

            <div class="register-footer">
                <span data-i18n="noAccount">{% trans "Não tem uma conta?" %}</span>
                <a href="{% url 'cadastro' %}" data-i18n="registerLink">{% trans "Cadastrar-se" %}</a>
            </div>
        </div>
    </div>

    <script>
        const TRANSLATIONS = {
            pt: {
                subtitle: "AAA-202",
                labelPhone: "Número de Telefone",
                phPhone: "Digite seu número de telefone",
                labelPass: "Sua Senha",
                phPass: "Digite sua senha",
                rememberText: "Lembrar meus dados",
                btnLogin: "Entrar",
                noAccount: "Não tem uma conta?",
                registerLink: "Cadastrar-se",
                loadingText: "Preparando o acesso ao menu..."
            },
            en: {
                subtitle: "Global Financial Education Platform",
                labelPhone: "Phone Number",
                phPhone: "Enter your phone number",
                labelPass: "Your Password",
                phPass: "Enter your password",
                rememberText: "Remember my details",
                btnLogin: "Sign In",
                noAccount: "Don't have an account?",
                registerLink: "Sign Up",
                loadingText: "Preparing menu access..."
            },
            ar: {
                subtitle: "منصة عالمية للتثقيف المالي",
                labelPhone: "رقم الهاتف",
                phPhone: "أدخل رقم هاتفك",
                labelPass: "كلمة المرور",
                phPass: "أدخل كلمة المرور",
                rememberText: "تذكر بياناتي",
                btnLogin: "تسجيل الدخول",
                noAccount: "ليس لديك حساب؟",
                registerLink: "إنشاء حساب",
                loadingText: "جارٍ تجهيز الدخول إلى القائمة..."
            },
            hi: {
                subtitle: "वैश्विक वित्तीय शिक्षा मंच",
                labelPhone: "फ़ोन नंबर",
                phPhone: "अपना फ़ोन नंबर दर्ज करें",
                labelPass: "आपका पासवर्ड",
                phPass: "अपना पासवर्ड दर्ज करें",
                rememberText: "मेरी जानकारी याद रखें",
                btnLogin: "लॉग इन करें",
                noAccount: "क्या आपका खाता नहीं है?",
                registerLink: "पंजीकरण करें",
                loadingText: "मेनू खोलने की तैयारी हो रही है..."
            },
            es: {
                subtitle: "Plataforma Global de Educación Financiera",
                labelPhone: "Número de Teléfono",
                phPhone: "Ingresa tu número de teléfono",
                labelPass: "Tu Contraseña",
                phPass: "Ingresa tu contraseña",
                rememberText: "Recordar mis datos",
                btnLogin: "Iniciar Sesión",
                noAccount: "¿No tienes una cuenta?",
                registerLink: "Registrarse",
                loadingText: "Preparando el acceso al menú..."
            }
        };

        const STORAGE_COUNTRY_KEY = "stada_selected_country";
        const STORAGE_LANG_KEY = "stada_selected_lang";

        document.addEventListener("DOMContentLoaded", function () {
            const langTriggerBtn = document.getElementById("langTriggerBtn");
            const langPopover = document.getElementById("langPopover");
            const langOptionBtns = document.querySelectorAll(".lang-option-btn");

            const dialTriggerBtn = document.getElementById("dialTriggerBtn");
            const dialDropdown = document.getElementById("dialDropdown");
            const dialItemBtns = document.querySelectorAll(".dial-item-btn");
            const dialCodeDisplay = document.getElementById("dialCodeDisplay");

            const userInp = document.querySelector('input[name="username"]');
            const passInp = document.querySelector('input[name="password"]');

            if (userInp) {
                userInp.placeholder = TRANSLATIONS.pt.phPhone;
                userInp.setAttribute("required", "true");
                userInp.setAttribute("maxlength", "12");
                userInp.setAttribute("inputmode", "numeric");
                userInp.addEventListener("input", function () {
                    this.value = this.value.replace(/[^0-9]/g, "").slice(0, 12);
                });
            }

            if (passInp) {
                passInp.placeholder = TRANSLATIONS.pt.phPass;
                passInp.setAttribute("required", "true");
                passInp.addEventListener("input", function () {
                    this.value = this.value.replace(/[^a-zA-Z0-9]/g, "");
                });
            }

            const togglePass = document.getElementById("togglePass");
            if (togglePass && passInp) {
                togglePass.addEventListener("click", function () {
                    const type = passInp.getAttribute("type") === "password" ? "text" : "password";
                    passInp.setAttribute("type", type);
                    this.classList.toggle("fa-eye");
                    this.classList.toggle("fa-eye-slash");
                });
            }

            function closeMenus() {
                langPopover.classList.remove("open");
                langTriggerBtn.setAttribute("aria-expanded", "false");
                dialDropdown.classList.remove("open");
                dialTriggerBtn.setAttribute("aria-expanded", "false");
            }

            langTriggerBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                const isOpen = langPopover.classList.contains("open");
                closeMenus();
                if (!isOpen) {
                    langPopover.classList.add("open");
                    langTriggerBtn.setAttribute("aria-expanded", "true");
                }
            });

            dialTriggerBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                const isOpen = dialDropdown.classList.contains("open");
                closeMenus();
                if (!isOpen) {
                    dialDropdown.classList.add("open");
                    dialTriggerBtn.setAttribute("aria-expanded", "true");
                }
            });

            document.addEventListener("click", function () {
                closeMenus();
            });

            function applyLanguage(langCode) {
                const validLang = TRANSLATIONS[langCode] ? langCode : "pt";
                const dict = TRANSLATIONS[validLang];

                document.documentElement.lang = validLang;
                document.documentElement.dir = validLang === "ar" ? "rtl" : "ltr";

                langOptionBtns.forEach((btn) => {
                    btn.classList.toggle("active", btn.getAttribute("data-lang") === validLang);
                });

                document.querySelectorAll("[data-i18n]").forEach((el) => {
                    const key = el.getAttribute("data-i18n");
                    if (dict[key]) {
                        el.textContent = dict[key];
                    }
                });

                if (userInp) {
                    userInp.placeholder = dict.phPhone;
                }
                if (passInp) {
                    passInp.placeholder = dict.phPass;
                }

                localStorage.setItem(STORAGE_LANG_KEY, validLang);
            }

            langOptionBtns.forEach((btn) => {
                btn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    applyLanguage(this.getAttribute("data-lang"));
                    closeMenus();
                });
            });

            function applyCountry(countryCode, syncLanguage = true) {
                const targetBtn = Array.from(dialItemBtns).find((b) => b.getAttribute("data-country") === countryCode) || dialItemBtns[0];

                dialItemBtns.forEach((b) => b.classList.remove("selected"));
                targetBtn.classList.add("selected");

                const dial = targetBtn.getAttribute("data-dial") || "+244";
                const countryLang = targetBtn.getAttribute("data-lang") || "pt";

                dialCodeDisplay.textContent = dial;

                localStorage.setItem(STORAGE_COUNTRY_KEY, targetBtn.getAttribute("data-country"));

                if (syncLanguage) {
                    applyLanguage(countryLang);
                }
            }

            dialItemBtns.forEach((btn) => {
                btn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    applyCountry(this.getAttribute("data-country"), true);
                    closeMenus();
                });
            });

            // Loading profissional de 1% a 100% ao enviar o formulário antes de prosseguir para o menu
            const loginForm = document.getElementById("loginForm");
            const stadaLoader = document.getElementById("stadaLoader");
            const loaderPercent = document.getElementById("loaderPercent");
            const loaderProgressBar = document.getElementById("loaderProgressBar");

            let isSubmittingWithLoader = false;

            loginForm.addEventListener("submit", function (event) {
                if (isSubmittingWithLoader) {
                    return;
                }

                if (!loginForm.checkValidity()) {
                    return;
                }

                event.preventDefault();
                isSubmittingWithLoader = true;

                stadaLoader.classList.add("active");
                let current = 1;
                loaderPercent.textContent = "1%";
                loaderProgressBar.style.width = "1%";

                const interval = setInterval(() => {
                    current += 1;
                    if (current > 100) {
                        current = 100;
                    }

                    loaderPercent.textContent = current + "%";
                    loaderProgressBar.style.width = current + "%";

                    if (current >= 100) {
                        clearInterval(interval);
                        setTimeout(() => {
                            loginForm.submit();
                        }, 180);
                    }
                }, 22);
            });

            // Restaurar preferências persistidas do usuário
            const savedCountry = localStorage.getItem(STORAGE_COUNTRY_KEY) || "AO";
            const savedLang = localStorage.getItem(STORAGE_LANG_KEY);

            applyCountry(savedCountry, !savedLang);
            if (savedLang) {
                applyLanguage(savedLang);
            }
        });
    </script>
</body>
</html>
