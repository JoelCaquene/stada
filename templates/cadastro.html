{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>stada | {% trans "Cadastro" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0056b3;
            --input-bg: #f8fafc;
            --text-dark: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0056b3 0%, #0082c8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-area { text-align: center; margin-bottom: 25px; color: white; }
        .logo-area h1 { font-size: 28px; font-weight: 700; }
        .logo-area p { font-size: 16px; opacity: 0.9; }

        .register-card {
            background: #ffffff;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 15px;
        }

        .flag-icon { margin-right: 10px; font-size: 18px; }
        .auth-input { width: 100%; padding: 15px 0; border: none; background: transparent; font-size: 15px; outline: none; }

        .toggle-password { cursor: pointer; color: #94a3b8; margin-left: 10px; }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-footer { text-align: center; margin-top: 20px; color: #ffffff; font-size: 14px; }
        .login-footer a { color: #ffffff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="logo-area">
            <i class="fa-solid fa-dna" style="font-size: 40px; margin-bottom: 10px;"></i>
            <h1>stada</h1>
            <p>Plataforma Médica</p>
        </div>

        <div class="register-card">
            <form method="post" class="auth-form">
                {% csrf_token %}

                <div class="form-group">
                    <label>1. {% trans "Número de Telefone (Celular)" %}</label>
                    <div class="input-wrapper">
                        <span class="flag-icon">🇦🇴</span>
                        <span style="margin-right:10px; font-weight:600;">+244</span>
                        <input type="text" name="phone_number" class="auth-input" placeholder="940 000 000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>2. {% trans "Criar Senha" %}</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock" style="color: #94a3b8;"></i>
                        <input type="password" name="password" id="pass1" class="auth-input" style="margin-left:10px;" placeholder="Mínimo de 8 caracteres" required>
                        <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePass('pass1', this)"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>3. {% trans "Confirmar Senha" %}</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock" style="color: #94a3b8;"></i>
                        <input type="password" name="confirm_password" id="pass2" class="auth-input" style="margin-left:10px;" placeholder="Repita sua senha" required>
                        <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePass('pass2', this)"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>4. {% trans "Código de Convite" %}</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user-plus" style="color: #94a3b8;"></i>
                        <input type="text" name="invited_by_code" class="auth-input" style="margin-left:10px;" placeholder="Insira o código (Opcional)" value="{{ request.GET.invite|default:'' }}">
                    </div>
                </div>
                
                <button type="submit" class="btn-register">{% trans "CADASTRAR" %}</button>
            </form>
        </div>

        <div class="login-footer">
            {% trans "Já tem uma conta?" %} <br>
            <a href="{% url 'login' %}">{% trans "Fazer Login" %}</a>
        </div>
    </div>

    <script>
        function togglePass(id, el) {
            const input = document.getElementById(id);
            input.type = (input.type === "password") ? "text" : "password";
            el.classList.toggle("fa-eye");
            el.classList.toggle("fa-eye-slash");
        }
    </script>
</body>
</html>
