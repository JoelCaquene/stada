{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'pt' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STADA - {% trans "Cadastro" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #060908;
            --surface-dark: #0d1412;
            --neon-cyan: #1ae6d6;
            --neon-cyan-glow: rgba(26, 230, 214, 0.35);
            --border-subtle: rgba(26, 230, 214, 0.25);
            --text-main: #ffffff;
            --text-muted: #7f9490;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 14%, rgba(26, 230, 214, 0.08), transparent 55%), var(--bg-dark);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 18px 20px 32px;
            overflow-x: hidden;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            z-index: 5;
        }

        .back-btn, .globe-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #d6e4e1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .back-btn:hover, .globe-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan-glow);
        }

        .lang-badge {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--neon-cyan);
            letter-spacing: 0.5px;
            margin-left: 6px;
        }

        .top-right-group {
            display: flex;
            align-items: center;
        }

        /* LOGOTIPO STADA */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 6px 0 26px;
        }

        .stada-emblem {
            width: 84px;
            height: 84px;
            filter: drop-shadow(0 0 14px rgba(26, 230, 214, 0.3));
            margin-bottom: 8px;
        }

        .stada-wordmark {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .stada-wordmark span {
            color: var(--neon-cyan);
        }

        /* FORMULÁRIO */
        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 54px;
            border-radius: 27px;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 2px rgba(26, 230, 214, 0.14);
        }

        .input-box i.field-icon {
            color: var(--text-muted);
            font-size: 0.98rem;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .ddi-trigger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px 4px 10px;
            flex-shrink: 0;
        }

        .ddi-trigger i {
            font-size: 0.72rem;
            color: var(--neon-cyan);
        }

        .ddi-divider {
            width: 1px;
            height: 22px;
            background-color: rgba(255, 255, 255, 0.14);
            margin-right: 10px;
            flex-shrink: 0;
        }

        .auth-form input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            padding-left: 12px;
        }

        .auth-form input.phone-input {
            padding-left: 0;
        }

        .auth-form input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .toggle-eye {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            flex-shrink: 0;
        }

        .toggle-eye:hover {
            color: var(--neon-cyan);
        }

        /* BOTÃO PRINCIPAL */
        .btn-submit-stada {
            width: 100%;
            height: 54px;
            margin-top: 12px;
            border: none;
            border-radius: 27px;
            background: linear-gradient(90deg, #12d8c8 0%, #3ef7e8 100%);
            color: #041311;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(26, 230, 214, 0.42);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-submit-stada:active {
            transform: scale(0.985);
        }

        .login-footer {
            margin-top: 16px;
            text-align: center;
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        /* MODAIS DE DDI E IDIOMAS */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 5, 4, 0.84);
            backdrop-filter: blur(6px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 90;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-sheet {
            width: 100%;
            max-width: 450px;
            height: 82vh;
            background: #0c1311;
            border-top: 1px solid var(--border-subtle);
            border-radius: 24px 24px 0 0;
            padding: 18px 16px 24px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #d8e7e4;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }

        .search-box input {
            width: 100%;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: #070b0a;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            padding: 0 14px 0 38px;
            outline: none;
        }

        .picker-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
        }

        .picker-item {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 11px 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
            font-family: 'Poppins', sans-serif;
            font-size: 0.86rem;
        }

        .picker-item:hover {
            border-color: var(--border-subtle);
            background: rgba(26, 230, 214, 0.07);
        }

        .picker-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .picker-code {
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 0.86rem;
        }

        /* TELA DE LOADING 0% -> 100% */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, rgba(26, 230, 214, 0.16), #050807 68%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 120;
            padding: 28px;
            text-align: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loader-ring-wrap {
            position: relative;
            width: 116px;
            height: 116px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(26, 230, 214, 0.16);
            border-top-color: var(--neon-cyan);
            animation: spinRing 0.95s linear infinite;
        }

        .loader-percent {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .loader-bar-track {
            width: 240px;
            height: 7px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.09);
            overflow: hidden;
            margin-top: 12px;
        }

        .loader-bar-fill {
            width: 0%;
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #12d8c8 0%, #48fff0 100%);
            transition: width 0.06s linear;
        }

        .loader-status {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #b7ceca;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- TOPO -->
        <div class="top-bar">
            <button type="button" class="back-btn" onclick="history.back()" aria-label="Voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="top-right-group">
                <button type="button" class="globe-btn" id="openLangModal" aria-label="Selecionar idioma">
                    <i class="fa-solid fa-globe"></i>
                </button>
                <span class="lang-badge" id="currentLangCode">PT</span>
            </div>
        </div>

        <!-- LOGOTIPO STADA PERSONALIZADO -->
        <div class="brand-header">
            <svg class="stada-emblem" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="60" r="52" stroke="#1ae6d6" stroke-opacity="0.22" stroke-width="2"/>
                <polygon points="60,18 96,40 96,80 60,102 24,80 24,40" stroke="#1ae6d6" stroke-width="3" fill="#0d1917"/>
                <path d="M74 43C74 38.5 68.5 36 60 36C51.5 36 46 39.2 46 44.5C46 50.2 53.5 52.2 61.5 54.5C69.5 56.8 75 59.5 75 66.2C75 72.5 68.5 76.5 59.5 76.5C50 76.5 44 73 43.5 67.5" stroke="#1ae6d6" stroke-width="4.5" stroke-linecap="round"/>
                <circle cx="60" cy="24" r="3" fill="#3ef7e8"/>
                <circle cx="60" cy="96" r="3" fill="#3ef7e8"/>
            </svg>
            <div class="stada-wordmark">ST<span>A</span>DA</div>
        </div>

        <!-- FORMULÁRIO (APENAS NÚMERO DE TELEFONE) -->
        <form method="post" class="auth-form" id="registerForm">
            {% csrf_token %}

            <div class="input-box">
                <i class="fa-solid fa-phone field-icon"></i>
                <button type="button" class="ddi-trigger" id="openDdiModal">
                    <span id="selectedDdiFlag">🌐</span>
                    <span id="selectedDdiText">+1</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <input type="hidden" name="country_code" id="countryCodeInput" value="+1">
                <span class="ddi-divider"></span>
                <input type="text" name="phone_number" id="phoneInput" class="phone-input" placeholder="Digite seu número de telefone" data-i18n-placeholder="phonePlaceholder" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock field-icon"></i>
                <input type="password" name="password" id="password" placeholder="Digite sua senha" data-i18n-placeholder="passwordPlaceholder" required>
                <button type="button" class="toggle-eye" onclick="togglePass('password', this)" aria-label="Mostrar senha">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock field-icon"></i>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirme sua senha" data-i18n-placeholder="confirmPasswordPlaceholder" required>
                <button type="button" class="toggle-eye" onclick="togglePass('confirm_password', this)" aria-label="Confirmar senha">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-user-plus field-icon"></i>
                <input type="text" name="invited_by_code" id="inviteInput" placeholder="Código de convite (opcional)" data-i18n-placeholder="invitePlaceholder" value="{{ request.GET.invite|default:'' }}">
            </div>

            <button type="submit" class="btn-submit-stada" id="submitBtn" data-i18n="registerBtn">
                Cadastrar
            </button>

            <div class="login-footer">
                <span data-i18n="hasAccount">Já tem uma conta?</span>
                <a href="{% url 'login' %}" data-i18n="loginLink">Entrar</a>
            </div>
        </form>
    </div>

    <!-- MODAL PESQUISÁVEL DE DDI DE TODOS OS PAÍSES DO MUNDO -->
    <div class="modal-backdrop" id="ddiModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title" data-i18n="selectDdiTitle">Selecionar código do país</div>
                <button type="button" class="modal-close" id="closeDdiModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="ddiSearchInput" placeholder="Pesquisar país ou código (+...)" data-i18n-placeholder="searchCountryPlaceholder">
            </div>
            <div class="picker-list" id="ddiList"></div>
        </div>
    </div>

    <!-- MODAL PESQUISÁVEL DE TODOS OS IDIOMAS NACIONAIS DO MUNDO -->
    <div class="modal-backdrop" id="langModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title" data-i18n="selectLangTitle">Selecionar idioma</div>
                <button type="button" class="modal-close" id="closeLangModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="langSearchInput" placeholder="Pesquisar idioma..." data-i18n-placeholder="searchLangPlaceholder">
            </div>
            <div class="picker-list" id="langList"></div>
        </div>
    </div>

    <!-- TELA DE LOADING PERSONALIZADA CONTANDO ATÉ 100% -->
    <div class="loading-overlay" id="loadingScreen">
        <div class="loader-ring-wrap">
            <div class="loader-ring"></div>
            <div class="loader-percent" id="loadingPercent">0%</div>
        </div>
        <div class="stada-wordmark" style="font-size: 1.05rem;">ST<span>A</span>DA</div>
        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loadingBar"></div>
        </div>
        <div class="loader-status" id="loadingStatus" data-i18n="loadingText">Carregando até 100% para o menu...</div>
    </div>

                invitePlaceholder: "Einladungscode (optional)",
                registerBtn: "Registrieren",
                hasAccount: "Bereits ein Konto?",
                loginLink: "Anmelden",
                selectDdiTitle: "Ländervorwahl wählen",
                searchCountryPlaceholder: "Land oder Vorwahl suchen (+...)",
                selectLangTitle: "Sprache wählen",
                searchLangPlaceholder: "Sprache suchen...",
                loadingText: "Lade auf 100 % ins Menü..."
            },
            it: {
                phonePlaceholder: "Inserisci il tuo numero di telefono",
                passwordPlaceholder: "Inserisci la password",
                confirmPasswordPlaceholder: "Conferma la password",
                invitePlaceholder: "Codice invito (opzionale)",
                registerBtn: "Registrati",
                hasAccount: "Hai già un account?",
                loginLink: "Accedi",
                selectDdiTitle: "Seleziona prefisso paese",
                searchCountryPlaceholder: "Cerca paese o prefisso (+...)",
                selectLangTitle: "Seleziona lingua",
                searchLangPlaceholder: "Cerca lingua...",
                loadingText: "Caricamento al 100% verso il menu..."
            }
        };

        async function translateDynamicText(text, targetLang) {
            if (!text || targetLang === "en") return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0].map(part => part[0]).join("");
            } catch (e) {
                return text;
            }
        }

        async function applyLanguage(langCode) {
            const baseLang = (langCode || "en").toLowerCase().split("-")[0];
            document.documentElement.lang = baseLang;
            document.documentElement.dir = ["ar", "he", "fa", "ur", "ps", "dv"].includes(baseLang) ? "rtl" : "ltr";
            document.getElementById("currentLangCode").textContent = baseLang.toUpperCase();

            const preset = TRANSLATIONS[baseLang];
            if (preset) {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    if (preset[key]) el.textContent = preset[key];
                });
                document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                    const key = el.getAttribute("data-i18n-placeholder");
                    if (preset[key]) el.placeholder = preset[key];
                });
                return;
            }

            const baseDict = TRANSLATIONS.en;
            for (const el of document.querySelectorAll("[data-i18n]")) {
                const key = el.getAttribute("data-i18n");
                if (baseDict[key]) {
                    el.textContent = await translateDynamicText(baseDict[key], baseLang);
                }
            }
            for (const el of document.querySelectorAll("[data-i18n-placeholder]")) {
                const key = el.getAttribute("data-i18n-placeholder");
                if (baseDict[key]) {
                    el.placeholder = await translateDynamicText(baseDict[key], baseLang);
                }
            }
        }

        // DETECTA AUTOMATICAMENTE O IDIOMA DO NAVEGADOR AO ABRIR
        (function detectBrowserLanguage() {
            const browserLangs = navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language || "en"];
            applyLanguage(browserLangs[0]);
        })();

        // RENDERIZAÇÃO E BUSCA DE DDI
        const ddiModal = document.getElementById("ddiModal");
        const ddiList = document.getElementById("ddiList");
        const ddiSearchInput = document.getElementById("ddiSearchInput");

        function renderDdiList(filterText = "") {
            const q = filterText.trim().toLowerCase();
            const filtered = COUNTRIES_DDI.filter(item =>
                item.name.toLowerCase().includes(q) ||
                item.code.toLowerCase().includes(q)
            );

            ddiList.innerHTML = "";
            filtered.forEach(item => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "picker-item";
                btn.innerHTML = `
                    <span class="picker-item-left">
                        <span>${item.flag}</span>
                        <span>${item.name}</span>
                    </span>
                    <span class="picker-code">${item.code}</span>
                `;
                btn.addEventListener("click", () => {
                    document.getElementById("selectedDdiFlag").textContent = item.flag;
                    document.getElementById("selectedDdiText").textContent = item.code;
                    document.getElementById("countryCodeInput").value = item.code;
                    ddiModal.classList.remove("active");
                });
                ddiList.appendChild(btn);
            });
        }

        document.getElementById("openDdiModal").addEventListener("click", () => {
            ddiSearchInput.value = "";
            renderDdiList("");
            ddiModal.classList.add("active");
            setTimeout(() => ddiSearchInput.focus(), 60);
        });

        document.getElementById("closeDdiModal").addEventListener("click", () => {
            ddiModal.classList.remove("active");
        });

        ddiSearchInput.addEventListener("input", (e) => {
            renderDdiList(e.target.value);
        });

        // RENDERIZAÇÃO E BUSCA DE IDIOMAS
        const langModal = document.getElementById("langModal");
        const langList = document.getElementById("langList");
        const langSearchInput = document.getElementById("langSearchInput");

        function renderLangList(filterText = "") {
            const q = filterText.trim().toLowerCase();
            const filtered = WORLD_LANGUAGES.filter(lang =>
                lang.native.toLowerCase().includes(q) ||
                lang.english.toLowerCase().includes(q) ||
                lang.code.toLowerCase().includes(q)
            );

            langList.innerHTML = "";
            filtered.forEach(lang => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "picker-item";
                btn.innerHTML = `
                    <span class="picker-item-left">
                        <span>${lang.native}</span>
                        <span style="color: var(--text-muted); font-size: 0.78rem;">(${lang.english})</span>
                    </span>
                    <span class="picker-code">${lang.code.toUpperCase()}</span>
                `;
                btn.addEventListener("click", () => {
                    applyLanguage(lang.code);
                    langModal.classList.remove("active");
                });
                langList.appendChild(btn);
            });
        }

        document.getElementById("openLangModal").addEventListener("click", () => {
            langSearchInput.value = "";
            renderLangList("");
            langModal.classList.add("active");
            setTimeout(() => langSearchInput.focus(), 60);
        });

        document.getElementById("closeLangModal").addEventListener("click", () => {
            langModal.classList.remove("active");
        });

        langSearchInput.addEventListener("input", (e) => {
            renderLangList(e.target.value);
        });

        [ddiModal, langModal].forEach(modal => {
            modal.addEventListener("click", (e) => {
                if (e.target === modal) modal.classList.remove("active");
            });
        });

        // MOSTRAR / OCULTAR SENHA
        function togglePass(id, btnEl) {
            const input = document.getElementById(id);
            const icon = btnEl.querySelector("i");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        // LOADING PERSONALIZADO CONTANDO ATÉ 100% AO CLICAR
        const registerForm = document.getElementById("registerForm");
        const loadingScreen = document.getElementById("loadingScreen");
        const loadingPercent = document.getElementById("loadingPercent");
        const loadingBar = document.getElementById("loadingBar");
        let isSubmittingWithLoader = false;

        registerForm.addEventListener("submit", function (e) {
            if (isSubmittingWithLoader) return;
            e.preventDefault();
            isSubmittingWithLoader = true;

            loadingScreen.classList.add("active");
            let progress = 0;
            loadingPercent.textContent = "0%";
            loadingBar.style.width = "0%";

            const timer = setInterval(() => {
                progress += 2;
                if (progress > 100) progress = 100;

                loadingPercent.textContent = progress + "%";
                loadingBar.style.width = progress + "%";

                if (progress >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        registerForm.submit();
                    }, 180);
                }
            }, 28);
        });
    </script>
