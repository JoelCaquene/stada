{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'pt' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STADA — {% trans "Cadastro" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-void: #07090b;
            --bg-elevated: #111519;
            --bg-input: #0e1216;
            --border-subtle: rgba(255, 255, 255, 0.14);
            --border-focus: #38f2d2;
            --cyan-main: #38f2d2;
            --cyan-bright: #5ffae0;
            --cyan-glow: rgba(56, 242, 210, 0.35);
            --text-primary: #ffffff;
            --text-secondary: #8c96a4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            /* Fundo escuro persistente estilo plataforma americana */
            background-image:
                radial-gradient(circle at 50% 12%, rgba(56, 242, 210, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 15% 88%, rgba(37, 99, 235, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* ================= TELA DE LOADING (1% A 100%) ================= */
        #stada-loader {
            position: fixed;
            inset: 0;
            background: #050709;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #stada-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .loader-brand-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            color: var(--cyan-main);
        }

        .loader-percent {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            margin-bottom: 12px;
        }

        .loader-track {
            width: 100%;
            max-width: 240px;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
        }

        .loader-fill {
            width: 1%;
            height: 100%;
            background: linear-gradient(90deg, var(--cyan-main), #06b6d4);
            border-radius: 99px;
            box-shadow: 0 0 14px var(--cyan-glow);
            transition: width 0.07s linear;
        }

        .loader-label {
            margin-top: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* ================= CONTAINER PRINCIPAL ================= */
        .app-container {
            width: 100%;
            max-width: 440px;
            padding: 18px 20px 36px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* TOPO COM BOTÃO DE IDIOMA (GLOBO) */
        .top-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .top-title-tag {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .globe-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .globe-btn:hover,
        .globe-btn.active {
            background: rgba(56, 242, 210, 0.14);
            border-color: var(--cyan-main);
            color: var(--cyan-main);
        }

        /* MENU DROPDOWN AUTOMÁTICO DE IDIOMAS */
        .lang-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            width: 225px;
            background: #13181e;
            border: 1px solid rgba(56, 242, 210, 0.28);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 3px;
        }

        .lang-dropdown.open {
            display: flex;
            animation: fadeDrop 0.16s ease-out;
        }

        @keyframes fadeDrop {
            from { opacity: 0; transform: translateY(-6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lang-option {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 0.84rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .lang-option.selected {
            background: rgba(56, 242, 210, 0.14);
            color: var(--cyan-main);
            font-weight: 700;
        }

        .lang-option .code-badge {
            font-size: 0.72rem;
            opacity: 0.75;
            font-weight: 600;
        }

        /* LOGOTIPO STADA (DIFERENTE DA IMAGEM) */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 6px 0 26px;
        }

        .stada-emblem {
            width: 92px;
            height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 18px rgba(56, 242, 210, 0.25));
        }

        .stada-wordmark {
            margin-top: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        /* FORMULÁRIO DE CADASTRO (APENAS TELEFONE, SEM E-MAIL) */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .field-box {
            width: 100%;
            min-height: 54px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .field-box:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(56, 242, 210, 0.14);
        }

        .field-icon {
            color: var(--text-secondary);
            font-size: 1rem;
            width: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .field-box:focus-within .field-icon {
            color: var(--cyan-main);
        }

        /* SELETOR DE INDICADOR DE PAÍS */
        .country-select-wrap {
            display: flex;
            align-items: center;
            padding-right: 10px;
            margin-right: 10px;
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            position: relative;
        }

        .country-select {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            padding-right: 18px;
            cursor: pointer;
            outline: none;
            font-variant-numeric: tabular-nums;
        }

        .country-select option {
            background: #111519;
            color: #ffffff;
        }

        .country-chevron {
            position: absolute;
            right: 8px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .field-input {
            flex: 1;
            width: 100%;
            height: 52px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.94rem;
            font-weight: 500;
        }

        .field-input::placeholder {
            color: #6b7482;
            font-weight: 400;
        }

        .input-phone {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.03em;
        }

        .eye-toggle {
            background: transparent;
            border: none;
            color: #6b7482;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            margin-left: 6px;
            transition: color 0.2s ease;
        }

        .eye-toggle:hover {
            color: var(--text-primary);
        }

        /* BOTÃO PRINCIPAL CADASTRAR */
        .btn-submit {
            margin-top: 14px;
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--cyan-bright) 0%, var(--cyan-main) 100%);
            color: #061311;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(56, 242, 210, 0.35), 0 8px 20px rgba(0, 0, 0, 0.45);
            transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-submit:hover {
            filter: brightness(1.04);
            box-shadow: 0 0 30px rgba(56, 242, 210, 0.5), 0 10px 24px rgba(0, 0, 0, 0.5);
        }

        .btn-submit:active {
            transform: scale(0.985);
        }

        /* RODAPÉ ENTRAR */
        .footer-login {
            margin-top: 22px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .footer-login a {
            color: var(--cyan-main);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .footer-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- LOADING PROFISSIONAL (1% A 100%) -->
    <div id="stada-loader">
        <div class="loader-brand">
            <svg width="46" height="46" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" stroke="#38f2d2" stroke-width="5" fill="rgba(56,242,210,0.08)"/>
                <path d="M32 62L50 28L68 62H56L50 49L44 62H32Z" fill="#38f2d2"/>
                <circle cx="50" cy="72" r="5" fill="#ffffff"/>
            </svg>
            <span class="loader-brand-name">STADA</span>
        </div>
        <div class="loader-percent" id="loaderPercent">1%</div>
        <div class="loader-track">
            <div class="loader-fill" id="loaderFill"></div>
        </div>
        <div class="loader-label" id="loaderLabel">STADA SYSTEM • LOADING</div>
    </div>

    <div class="app-container">
        <!-- CABEÇALHO COM BOTÃO DE IDIOMA NO TOPO -->
        <header class="top-header">
            <span class="top-title-tag" data-i18n="top_tag">{% trans "CADASTRO" %}</span>

            <button type="button" class="globe-btn" id="globeBtn" aria-label="Select Language">
                <i class="fa-solid fa-globe"></i>
            </button>

            <!-- SELETOR DE IDIOMA QUE MUDA AUTOMATICAMENTE AO SELECIONAR -->
            <div class="lang-dropdown" id="langDropdown">
                <button type="button" class="lang-option" data-locale="pt-AO">
                    <span>🇦🇴 Angola (PT)</span>
                    <span class="code-badge">+244</span>
                </button>
                <button type="button" class="lang-option" data-locale="pt-PT">
                    <span>🇵🇹 Portugal (PT)</span>
                    <span class="code-badge">+351</span>
                </button>
                <button type="button" class="lang-option" data-locale="pt-BR">
                    <span>🇧🇷 Brasil (PT)</span>
                    <span class="code-badge">+55</span>
                </button>
                <button type="button" class="lang-option" data-locale="en-CA">
                    <span>🇨🇦 Canada (EN)</span>
                    <span class="code-badge">+1</span>
                </button>
                <button type="button" class="lang-option" data-locale="ar-EG">
                    <span>🇪🇬 Egypt (العربية)</span>
                    <span class="code-badge">+20</span>
                </button>
                <button type="button" class="lang-option" data-locale="hi-IN">
                    <span>🇮🇳 India (हिन्दी / EN)</span>
                    <span class="code-badge">+91</span>
                </button>
                <button type="button" class="lang-option" data-locale="en-NG">
                    <span>🇳🇬 Nigeria (EN)</span>
                    <span class="code-badge">+234</span>
                </button>
                <button type="button" class="lang-option" data-locale="pt-MZ">
                    <span>🇲🇿 Moçambique (PT)</span>
                    <span class="code-badge">+258</span>
                </button>
                <button type="button" class="lang-option" data-locale="es-ES">
                    <span>🇪🇸 España (ES)</span>
                    <span class="code-badge">+34</span>
                </button>
            </div>
        </header>

        <!-- LOGOTIPO STADA (NOVO DESIGN GEOMÉTRICO HEXAGONAL) -->
        <div class="logo-section">
            <div class="stada-emblem">
                <svg width="88" height="88" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="#38f2d2" stroke-width="5.5" fill="rgba(56, 242, 210, 0.06)"/>
                    <polygon points="50,18 77,34 77,66 50,82 23,66 23,34" stroke="rgba(56, 242, 210, 0.35)" stroke-width="2" fill="none"/>
                    <path d="M31 63L50 27L69 63H57L50 49L43 63H31Z" fill="#38f2d2"/>
                    <rect x="46" y="68" width="8" height="6" rx="2" fill="#ffffff"/>
                </svg>
            </div>
            <div class="stada-wordmark">STADA</div>
        </div>

        <!-- FORMULÁRIO (APENAS TELEFONE, SEM CADASTRO POR E-MAIL) -->
        <form method="post" class="auth-form" id="registerForm">
            {% csrf_token %}

            <!-- INDICADOR DE PAÍS + NÚMERO (APENAS NÚMEROS) -->
            <div class="field-box">
                <span class="field-icon"><i class="fa-solid fa-phone"></i></span>
                <div class="country-select-wrap">
                    <select class="country-select" name="country_code" id="countryCodeSelect">
                        <option value="+244" data-locale="pt-AO" data-placeholder="923000000">+244</option>
                        <option value="+351" data-locale="pt-PT" data-placeholder="912000000">+351</option>
                        <option value="+55"  data-locale="pt-BR" data-placeholder="11990000000">+55</option>
                        <option value="+1"   data-locale="en-CA" data-placeholder="4165550199">+1</option>
                        <option value="+20"  data-locale="ar-EG" data-placeholder="1000000000">+20</option>
                        <option value="+91"  data-locale="hi-IN" data-placeholder="9810000000">+91</option>
                        <option value="+234" data-locale="en-NG" data-placeholder="8020000000">+234</option>
                        <option value="+258" data-locale="pt-MZ" data-placeholder="840000000">+258</option>
                        <option value="+34"  data-locale="es-ES" data-placeholder="612000000">+34</option>
                    </select>
                    <i class="fa-solid fa-chevron-down country-chevron"></i>
                </div>
                <input
                    type="tel"
                    name="phone_number"
                    id="phoneNumberInput"
                    class="field-input input-phone"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    autocomplete="tel-national"
                    data-i18n-placeholder="phone_ph"
                    placeholder="{% trans 'Digite seu número de telefone' %}"
                    required
                >
            </div>

            <!-- PALAVRA PASSE -->
            <div class="field-box">
                <span class="field-icon"><i class="fa-solid fa-lock"></i></span>
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="field-input"
                    data-i18n-placeholder="pass_ph"
                    placeholder="{% trans 'Digite sua senha' %}"
                    required
                >
                <button type="button" class="eye-toggle" onclick="togglePass('password', this)" aria-label="Toggle Password">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>

            <!-- REPITA SENHA -->
            <div class="field-box">
                <span class="field-icon"><i class="fa-solid fa-shield-halved"></i></span>
                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    class="field-input"
                    data-i18n-placeholder="confirm_ph"
                    placeholder="{% trans 'Confirme sua senha' %}"
                    required
                >
                <button type="button" class="eye-toggle" onclick="togglePass('confirm_password', this)" aria-label="Toggle Confirm Password">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>

            <!-- CÓDIGO DE CONVITE -->
            <div class="field-box">
                <span class="field-icon"><i class="fa-solid fa-user-plus"></i></span>
                <input
                    type="text"
                    name="invited_by_code"
                    id="invited_by_code"
                    class="field-input"
                    data-i18n-placeholder="invite_ph"
                    placeholder="{% trans 'Código de convite (opcional)' %}"
                    value="{{ request.GET.invite|default:'' }}"
                >
            </div>

            <!-- BOTÃO CADASTRAR -->
            <button type="submit" class="btn-submit" data-i18n="btn_register">
                {% trans "Cadastrar" %}
            </button>
        </form>

        <!-- RODAPÉ -->
        <div class="footer-login">
            <span data-i18n="has_account">{% trans "Já tem uma conta?" %}</span>
            <a href="{% url 'login' %}" data-i18n="btn_login">{% trans "Entrar" %}</a>
        </div>
    </div>

    <script>
        // 1. LOADING DE 1% A 100% ANTES DE ACESSAR / SUBMETER
        function runStadaLoader(onComplete, stepDelay = 12) {
            const loader = document.getElementById('stada-loader');
            const percentEl = document.getElementById('loaderPercent');
            const fillEl = document.getElementById('loaderFill');
            const labelEl = document.getElementById('loaderLabel');

            loader.classList.remove('hidden');
            let count = 1;

            const timer = setInterval(() => {
                percentEl.textContent = count + '%';
                fillEl.style.width = count + '%';

                if (count < 40) {
                    labelEl.textContent = 'STADA • INITIALIZING';
                } else if (count < 80) {
                    labelEl.textContent = 'STADA • SYNCING REGION';
                } else {
                    labelEl.textContent = 'STADA • READY';
                }

                if (count >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        loader.classList.add('hidden');
                        if (typeof onComplete === 'function') onComplete();
                    }, 160);
                }
                count++;
            }, stepDelay);
        }

        // 2. APENAS NÚMEROS NO TELEFONE
        const phoneInput = document.getElementById('phoneNumberInput');
        phoneInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
        });
        phoneInput.addEventListener('keypress', function (e) {
            if (!/[0-9]/.test(e.key)) {
                e.preventDefault();
            }
        });

        // 3. IDIOMAS E INDICADORES (AO, PT, BR, CA, EG, IN, NG, MZ, ES)
        const translations = {
            pt: {
                top_tag: "CADASTRO",
                phone_ph: "Digite seu número de telefone",
                pass_ph: "Digite sua senha",
                confirm_ph: "Confirme sua senha",
                invite_ph: "Código de convite (opcional)",
                btn_register: "Cadastrar",
                has_account: "Já tem uma conta?",
                btn_login: "Entrar"
            },
            en: {
                top_tag: "SIGN UP",
                phone_ph: "Enter your phone number",
                pass_ph: "Enter your password",
                confirm_ph: "Confirm your password",
                invite_ph: "Invitation code (optional)",
                btn_register: "Sign Up",
                has_account: "Already have an account?",
                btn_login: "Sign In"
            },
            es: {
                top_tag: "REGISTRO",
                phone_ph: "Ingrese su número de teléfono",
                pass_ph: "Ingrese su contraseña",
                confirm_ph: "Confirme su contraseña",
                invite_ph: "Código de invitación (opcional)",
                btn_register: "Registrarse",
                has_account: "¿Ya tienes una cuenta?",
                btn_login: "Iniciar sesión"
            },
            ar: {
                top_tag: "تسجيل",
                phone_ph: "أدخل رقم هاتفك",
                pass_ph: "أدخل كلمة المرور",
                confirm_ph: "أكد كلمة المرور",
                invite_ph: "رمز الدعوة (اختياري)",
                btn_register: "تسجيل",
                has_account: "هل لديك حساب بالفعل؟",
                btn_login: "تسجيل الدخول"
            },
            hi: {
                top_tag: "पंजीकरण",
                phone_ph: "अपना फ़ोन नंबर दर्ज करें",
                pass_ph: "अपना पासवर्ड दर्ज करें",
                confirm_ph: "पासवर्ड की पुष्टि करें",
                invite_ph: "आमंत्रण कोड (वैकल्पिक)",
                btn_register: "पंजीकरण करें",
                has_account: "क्या आपके पास पहले से खाता है?",
                btn_login: "लॉग इन करें"
            }
        };

        const localeToLang = {
            "pt-AO": "pt",
            "pt-PT": "pt",
            "pt-BR": "pt",
            "pt-MZ": "pt",
            "en-CA": "en",
            "en-NG": "en",
            "es-ES": "es",
            "ar-EG": "ar",
            "hi-IN": "hi"
        };

        const globeBtn = document.getElementById('globeBtn');
        const langDropdown = document.getElementById('langDropdown');
        const langOptions = document.querySelectorAll('.lang-option');
        const countrySelect = document.getElementById('countryCodeSelect');

        // Abre / fecha seletor de idioma no topo
        globeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            const isOpen = langDropdown.classList.toggle('open');
            globeBtn.classList.toggle('active', isOpen);
        });

        document.addEventListener('click', function (e) {
            if (!langDropdown.contains(e.target) && !globeBtn.contains(e.target)) {
                langDropdown.classList.remove('open');
                globeBtn.classList.remove('active');
            }
        });

        // Aplica o idioma e sincroniza indicador + placeholder + persistência
        function applyLocale(locale) {
            const langCode = localeToLang[locale] || "en";
            const dict = translations[langCode];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) el.setAttribute('placeholder', dict[key]);
            });

            // Atualiza opção ativa no menu do globo
            langOptions.forEach(opt => {
                opt.classList.toggle('selected', opt.getAttribute('data-locale') === locale);
            });

            // Atualiza indicador telefônico correspondente
            for (let i = 0; i < countrySelect.options.length; i++) {
                if (countrySelect.options[i].getAttribute('data-locale') === locale) {
                    countrySelect.selectedIndex = i;
                    break;
                }
            }

            localStorage.setItem('stada_locale', locale);
            document.documentElement.lang = langCode;
        }

        // Mudança automática ao clicar no idioma no topo
        langOptions.forEach(option => {
            option.addEventListener('click', function () {
                const selectedLocale = this.getAttribute('data-locale');
                applyLocale(selectedLocale);
                langDropdown.classList.remove('open');
                globeBtn.classList.remove('active');
            });
        });

        // Mudança automática ao selecionar o indicador de país
        countrySelect.addEventListener('change', function () {
            const locale = this.options[this.selectedIndex].getAttribute('data-locale');
            applyLocale(locale);
        });

        // 4. MOSTRAR / OCULTAR SENHA
        function togglePass(inputId, btnEl) {
            const input = document.getElementById(inputId);
            const icon = btnEl.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        // 5. SUBMISSÃO COM LOADING DE 1% A 100%
        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', function (e) {
            e.preventDefault();
            runStadaLoader(() => {
                registerForm.submit();
            }, 10);
        });

        // Inicialização
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('stada_locale');
            applyLocale(saved && localeToLang[saved] ? saved : 'pt-AO');
            runStadaLoader(null, 11);
        });
    </script>
</body>
</html>
