{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>stada | {% trans "Login" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0056b3;
            --input-bg: #f8fafc;
            --text-dark: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0056b3 0%, #0082c8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-area { text-align: center; margin-bottom: 25px; color: white; }
        .logo-area h1 { font-size: 28px; font-weight: 700; }
        .logo-area p { font-size: 16px; opacity: 0.9; }

        .login-card {
            background: #ffffff;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 15px;
        }

        /* Suporte para os inputs gerados pelo Django Form */
        .input-wrapper input {
            width: 100%;
            padding: 15px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-wrapper i.input-icon {
            color: #94a3b8;
            margin-right: 12px;
            font-size: 16px;
        }

        .toggle-password { cursor: pointer; color: #94a3b8; margin-left: 10px; }

        .options-row {
            display: flex;
            align-items: center;
            margin: 15px 0 20px 2px;
            color: var(--text-dark);
            font-size: 14px;
        }

        .options-row input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--primary-blue);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .options-row label {
            cursor: pointer;
            user-select: none;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .register-footer { text-align: center; margin-top: 20px; color: #ffffff; font-size: 14px; }
        .register-footer a { color: #ffffff; font-weight: 700; text-decoration: none; }
        
        .support-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.8;
        }
        .support-link a {
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .support-link a:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="logo-area">
            <i class="fa-solid fa-dna" style="font-size: 40px; margin-bottom: 10px;"></i>
            <h1>stada</h1>
            <p>Plataforma Médica</p>
        </div>

        <div class="login-card">
            <form method="post" class="auth-form">
                {% csrf_token %}

                <div class="form-group">
                    <label>{% trans "Número de Telefone (Celular)" %}</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        {{ form.username }}
                    </div>
                </div>

                <div class="form-group">
                    <label>{% trans "Sua Senha" %}</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        {{ form.password }}
                        <i class="fa-solid fa-eye-slash toggle-password" id="togglePass"></i>
                    </div>
                </div>

                <div class="options-row">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">{% trans "Lembrar meus dados" %}</label>
                </div>
                
                <button type="submit" class="btn-login">{% trans "ENTRAR" %}</button>
            </form>
        </div>

        <div class="register-footer">
            {% trans "Não tem uma conta?" %} <br>
            <a href="{% url 'cadastro' %}">{% trans "Cadastrar-se" %}</a>
        </div>

        <div class="support-link">
            <a href="#">
                <i class="fa-solid fa-headset"></i>
                {% trans "Suporte Online" %}
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Captura os inputs renderizados pelo Django e aplica atributos e estilos nativos
            const userInp = document.querySelector('input[name="username"]');
            const passInp = document.querySelector('input[name="password"]');
            
            if(userInp) {
                userInp.placeholder = '940 000 000';
                userInp.setAttribute('required', 'true');
            }
            if(passInp) {
                passInp.placeholder = '••••••••';
                passInp.setAttribute('required', 'true');
            }

            // Script para alternar visibilidade da senha
            const togglePass = document.getElementById('togglePass');
            if(togglePass && passInp) {
                togglePass.addEventListener('click', function() {
                    const type = passInp.getAttribute('type') === 'password' ? 'text' : 'password';
                    passInp.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        });
    </script>
</body>
</html>
